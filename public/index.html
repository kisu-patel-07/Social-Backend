<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialDM API - Status</title>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text {
            color: #166534;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-card {
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .info-label {
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 5px;
        }
        .info-value {
            color: #111827;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .link-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .link-button:hover {
            background: #5568d3;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 0.875rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SocialDM API</h1>
        <p class="subtitle">Backend Status Dashboard</p>
        
        <div class="status">
            <div class="status-indicator"></div>
            <div class="status-text">All Systems Operational</div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <div class="info-label">Version</div>
                <div class="info-value" id="version">Loading...</div>
            </div>
            <div class="info-card">
                <div class="info-label">Environment</div>
                <div class="info-value" id="environment">Production</div>
            </div>
            <div class="info-card">
                <div class="info-label">Uptime</div>
                <div class="info-value" id="uptime">99.9%</div>
            </div>
        </div>

        <div class="links">
            <a href="/api/v1" class="link-button">
                📡 API Endpoint
            </a>
            <a href="https://github.com/kisu-patel-07/Social-Backend" class="link-button" target="_blank" rel="noopener noreferrer">
                📚 Documentation
            </a>
        </div>

        <div class="footer">
            <p>Social Media Automation SaaS Platform</p>
            <p>Built with Express.js • Deployed on Vercel</p>
        </div>
    </div>

    <script>
        // Fetch API status
        fetch('/')
            .then(response => response.json())
            .then(data => {
                if (data.data && data.data.version) {
                    document.getElementById('version').textContent = 'v' + data.data.version;
                }
            })
            .catch(() => {
                document.getElementById('version').textContent = 'v1.0.0';
            });
    </script>
</body>
</html>
